name: CI

# ตรวจทุก PR + ทุก push เข้า main — ต้นแบบจาก backend .github/workflows/ci.yml (Final-Backlog N1)
# เดิม merge ทุกครั้งตรวจด้วยมือ · ขั้นเดียวกับที่ README §10 บอกให้รันก่อน commit
on:
  push:
    branches: [main]
  pull_request:

# PR เดียวกัน push ซ้ำ = ยกเลิกรอบเก่าที่ยังรันอยู่
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ค่า dummy สำหรับ build เท่านั้น — ไม่มี backend ตอน build (หน้าทั้งหมด render ตอนมีคำขอ ไม่ยิง API ตอน build)
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
      NEXT_PUBLIC_AUTH_COOKIE: session
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # ตรงกับ backend CI + เครื่อง dev
          cache: npm

      - run: npm ci

      # lint:i18n + lint:theme + lint:ui + tsc --noEmit + eslint (package.json "check")
      - run: npm run check
      - run: npm run build
